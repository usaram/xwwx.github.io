<!DOCTYPE html>
<html>
<body style="background:black;color:white;text-align:center">

<h2>Painel</h2>

<select id="profile">
  <option value="1">Perfil 1</option>
  <option value="2">Perfil 2</option>
</select>

<input id="color" placeholder="Cor (#c77dff)">
<input id="twitter" placeholder="Twitter">
<input id="insta" placeholder="Instagram">
<input id="tiktok" placeholder="TikTok">
<input id="roblox" placeholder="Roblox">

<br><br>
<button onclick="save()">Salvar</button>

<script>
function save(){
  const id = profile.value;

  const config = {
    color: color.value,
    links:{
      twitter: twitter.value,
      insta: insta.value,
      tiktok: tiktok.value,
      roblox: roblox.value
    }
  };

  localStorage.setItem("config_"+id, JSON.stringify(config));
  alert("Salvo!");
}
</script>

</body>
</html>
